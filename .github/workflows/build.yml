name: Build GDExtension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: matrix.platform == 'macos'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: matrix.platform == 'windows'
        run: choco install ninja -y

      - name: Setup MSVC environment (Windows)
        if: matrix.platform == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.platform }}-pixeldither-${{ github.run_id }}
          restore-keys: |
            ${{ matrix.platform }}-pixeldither-
          max-size: 500M

      - name: Configure (reldebinfo)
        run: >
          cmake --preset reldebinfo
          -G Ninja
          -DCMAKE_SYSTEM_NAME=${{ matrix.platform }}
          ${{ matrix.platform == 'windows' && '-DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl' || '' }}

      - name: Build (reldebinfo)
        run: cmake --build --preset reldebinfo --config RelWithDebInfo

      - name: Configure (release)
        run: >
          cmake --preset release
          -G Ninja
          -DCMAKE_SYSTEM_NAME=${{ matrix.platform }}
          ${{ matrix.platform == 'windows' && '-DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl' || '' }}

      - name: Build (release)
        run: cmake --build --preset release --config Release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: pixeldither-${{ matrix.platform }}
          path: project/addons/pixeldither/bin/${{ matrix.platform }}/

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Assemble package
        run: |
          mkdir -p release/pixeldither/bin/linux
          mkdir -p release/pixeldither/bin/windows
          mkdir -p release/pixeldither/bin/macos
          cp -r artifacts/pixeldither-linux/* release/pixeldither/bin/linux/ || true
          cp -r artifacts/pixeldither-windows/* release/pixeldither/bin/windows/ || true
          cp -r artifacts/pixeldither-macos/* release/pixeldither/bin/macos/ || true
          cp project/addons/pixeldither/pixeldither.gdextension release/pixeldither/
          cd release && zip -r ../pixeldither.zip pixeldither

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: pixeldither.zip
