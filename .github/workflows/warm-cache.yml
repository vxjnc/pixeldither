name: Warm Cache

on:
  workflow_dispatch:

jobs:
  warm:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: macos

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache godot-cpp build
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ matrix.platform }}-godotcpp-${{ matrix.platform == 'windows' && hashFiles('godot-cpp/**', 'CMakeLists.txt') || hashFiles('godot-cpp/**') }}

      - name: Configure (reldebinfo)
        run: >
          cmake --preset reldebinfo
          -DCMAKE_SYSTEM_NAME=${{ matrix.platform }}
          ${{ matrix.platform == 'windows' && '-DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl' || '' }}

      - name: Build (reldebinfo)
        run: cmake --build --preset reldebinfo --parallel 2

      - name: Configure (release)
        run: >
          cmake --preset release
          -DCMAKE_SYSTEM_NAME=${{ matrix.platform }}
          ${{ matrix.platform == 'windows' && '-DCMAKE_CXX_COMPILER=cl -DCMAKE_C_COMPILER=cl' || '' }}

      - name: Build (release)
        run: cmake --build --preset release --parallel 2
